<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الفواتير والنواقص</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .controls-section {
            background: #f1f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            font-size: 0.9em;
        }

        select, input, button {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-print {
            background-color: #27ae60;
        }

        .btn-print:hover {
            background-color: #219150;
        }

        /* تنسيق الجداول */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        .summary-box {
            margin-top: 20px;
            float: left;
            width: 300px;
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 1.05em;
        }

        .summary-row.total {
            border-top: 2px dashed #bbb;
            font-weight: bold;
            font-size: 1.2em;
            color: var(--accent-color);
            margin-top: 5px;
            padding-top: 10px;
        }

        .clear-fix {
            clear: both;
        }

        /* ---------------------------------------------------- */
        /* قواعد الطباعة (تُطبق فقط عند أمر الطباعة Window.print) */
        /* ---------------------------------------------------- */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .no-print, .controls-section {
                display: none !important;
            }

            .container {
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: 100%;
            }

            /* إخفاء بيانات التاجر والأسعار في فاتورة النواقص */
            body.print-shortages .merchant-info,
            body.print-shortages .price-column,
            body.print-shortages .available-column,
            body.print-shortages .summary-box {
                display: none !important;
            }

            /* إظهار كروت الحساب فقط في حالة الطباعة العادية */
            body.print-shortages .invoice-title::after {
                content: "فاتورة النواقص";
            }

            body.print-shortages .invoice-title-text {
                display: none;
            }

            th, td {
                border: 1px solid #000 !important;
                color: #000 !important;
            }

            th {
                background-color: #f0f0f0 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- لوحة التحكم للطباعة واختيار العملاء -->
    <div class="controls-section no-print">
        <div class="form-group">
            <label for="customerSelect">اختر العميل (اختياري لربط حساب قديم):</label>
            <select id="customerSelect" onchange="updateCustomerBalance()">
                <option value="">-- بدون تحديد عميل --</option>
                <option value="1" data-balance="250">أحمد محمود (رصيد سابق: 250)</option>
                <option value="2" data-balance="500">شركة الأمل (رصيد سابق: 500)</option>
                <option value="3" data-balance="0">مصطفى علي (رصيد سابق: 0)</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: auto;">
            <button class="btn-print" onclick="printStandardInvoice()">طباعة فاتورة العميل</button>
        </div>

        <div class="form-group" style="margin-top: auto;">
            <button class="btn-print" style="background-color: #e67e22;" onclick="printShortagesInvoice()">طباعة فاتورة النواقص</button>
        </div>
    </div>

    <!-- ترويسة الفاتورة -->
    <div class="header">
        <h2 class="invoice-title">
            <span class="invoice-title-text">فاتورة المبيعات</span>
        </h2>
        
        <!-- معلومات التواصل (تم إزالة أيموشن الفون) -->
        <div class="merchant-info">
            <p>اسم التاجر: محلات السلام للتجارة</p>
            <p>رقم الهاتف: 01012345678</p>
        </div>
    </div>

    <!-- جدول المنتجات -->
    <table id="invoiceTable">
        <thead>
            <tr>
                <th class="count-column">عدد</th>
                <th>اسم المنتج</th>
                <th class="price-column">السعر</th>
                <th class="price-column">الإجمالي</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2</td>
                <td>منتج أ</td>
                <td class="price-column">150</td>
                <td class="price-column">300</td>
            </tr>
            <tr>
                <td>5</td>
                <td>منتج ب</td>
                <td class="price-column">40</td>
                <td class="price-column">200</td>
            </tr>
        </tbody>
    </table>

    <!-- صندوق ملخص الحسابات -->
    <div class="summary-box">
        <div class="summary-row">
            <span>الرصيد السابق:</span>
            <span id="previousBalance">0</span>
        </div>
        <div class="summary-row">
            <span>الرصيد الحالي:</span>
            <span id="currentBalance">500</span>
        </div>
        <div class="summary-row total">
            <span>الإجمالي:</span>
            <span id="grandTotal">500</span>
        </div>
    </div>

    <div class="clear-fix"></div>
</div>

<script>
    // تحديث الرصيد السابق والإجمالي بناءً على العميل المختار
    function updateCustomerBalance() {
        const select = document.getElementById('customerSelect');
        const selectedOption = select.options[select.selectedIndex];
        
        const previousBalance = selectedOption.value ? parseFloat(selectedOption.getAttribute('data-balance')) : 0;
        const currentBalance = parseFloat(document.getElementById('currentBalance').innerText);
        
        const grandTotal = previousBalance + currentBalance;

        document.getElementById('previousBalance').innerText = previousBalance;
        document.getElementById('grandTotal').innerText = grandTotal;
    }

    // طباعة الفاتورة العادية للعميل
    function printStandardInvoice() {
        document.body.classList.remove('print-shortages');
        window.print();
    }

    // طباعة فاتورة النواقص (تخفي السعر واسم التاجر والمتاح)
    function printShortagesInvoice() {
        document.body.classList.add('print-shortages');
        window.print();
    }
</script>

</body>
</html>
